        <p class="uk-text-lead">A small open-source task board for teams. Plan the week, move cards, ship.</p>
        <div class="uk-alert-primary" uk-alert>
          <p>Marigold is an example product. It shows what a product looks like on this site: a short pitch, the latest release and links to its docs and support. Replace it with your own.</p>
        </div>
        <p><span class="uk-label uk-label-success">Latest: 1.1.0</span></p>
        <ul class="uk-list uk-list-bullet">
          <li>Boards with columns you name yourself.</li>
          <li>Cards with owners, due dates and checklists.</li>
          <li>Works in the browser, on any device.</li>
        </ul>
        <p>
          <a class="uk-button uk-button-primary uk-margin-small-right" href="/docs/getting-started">Get started</a>
          <a class="uk-button uk-button-default" href="/support">Get help</a>
