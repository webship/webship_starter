        <p class="uk-text-lead">Everything you need to run Marigold, the example product of this site. Start with the first guide, then pick what you need.</p>
        <h2>Guides</h2>
        <div class="uk-grid-match uk-child-width-1-3@m" uk-grid>
          <div>
            <a class="uk-card uk-card-default uk-card-hover uk-card-body uk-display-block uk-link-toggle" href="/docs/getting-started">
              <span class="uk-text-primary" uk-icon="icon: play-circle; ratio: 1.5"></span>
              <h3 class="uk-card-title uk-link-heading">Getting started</h3>
              <p>Install Marigold and sign in for the first time.</p>
            </a>
          </div>
          <div>
            <a class="uk-card uk-card-default uk-card-hover uk-card-body uk-display-block uk-link-toggle" href="/docs/your-first-board">
              <span class="uk-text-primary" uk-icon="icon: grid; ratio: 1.5"></span>
              <h3 class="uk-card-title uk-link-heading">Your first board</h3>
              <p>Create a board, add cards and invite your team.</p>
            </a>
          </div>
          <div>
            <a class="uk-card uk-card-default uk-card-hover uk-card-body uk-display-block uk-link-toggle" href="/docs/questions-and-answers">
              <span class="uk-text-primary" uk-icon="icon: question; ratio: 1.5"></span>
              <h3 class="uk-card-title uk-link-heading">Questions and answers</h3>
              <p>Limits, shortcuts and the answers to common questions.</p>
            </a>
          </div>
        </div>
        <p class="uk-margin-large-top">Can't find what you need? Visit <a href="/support">Support</a>.</p>
        <p class="uk-text-meta uk-margin-large-top">This is example content. Edit it or delete it from Content.</p>
