  body:
    -
      value: |-
        <p class="uk-text-lead">Need a hand with Marigold? Most answers are one click away.</p>
        <div class="uk-grid-match uk-child-width-1-3@m" uk-grid>
          <div>
            <div class="uk-card uk-card-default uk-card-body">
              <span class="uk-text-primary" uk-icon="icon: file-text; ratio: 2"></span>
              <h3 class="uk-card-title">Read the docs</h3>
              <p>Install Marigold, set up your first board and learn the basics.</p>
              <a class="uk-button uk-button-text" href="/docs">Documentation</a>
            </div>
          </div>
          <div>
            <div class="uk-card uk-card-default uk-card-body">
              <span class="uk-text-primary" uk-icon="icon: question; ratio: 2"></span>
              <h3 class="uk-card-title">Ask a question</h3>
              <p>Check the questions people ask most, then write to us if yours is not there.</p>
              <a class="uk-button uk-button-text" href="/docs/questions-and-answers">Questions and answers</a>
            </div>
          </div>
          <div>
            <div class="uk-card uk-card-default uk-card-body">
              <span class="uk-text-primary" uk-icon="icon: comments; ratio: 2"></span>
              <h3 class="uk-card-title">Report a problem</h3>
              <p>Something broken? Tell us what you did, what you saw and the version you use.</p>
              <a class="uk-button uk-button-text" href="/contact">Contact us</a>
            </div>
          </div>
        </div>
        <h2 class="uk-margin-large-top">Frequently asked</h2>
        <ul uk-accordion>
          <li class="uk-open">
            <a class="uk-accordion-title" href="#">Which version should I use?</a>
            <div class="uk-accordion-content">
              <p>The latest release, <a href="/products/marigold/releases/1.1.0">Marigold 1.1.0</a>. Every release page lists what changed.</p>
            </div>
          </li>
          <li>
            <a class="uk-accordion-title" href="#">Is Marigold free?</a>
            <div class="uk-accordion-content">
              <p>Yes. Marigold is an example product, open source, and made up for this site.</p>
            </div>
          </li>
          <li>
            <a class="uk-accordion-title" href="#">How fast will I hear back?</a>
            <div class="uk-accordion-content">
              <p>We answer messages from the contact form within two working days.</p>
            </div>
          </li>
        </ul>
        <div class="uk-background-muted uk-padding uk-border-rounded uk-margin-large-top">
          <h2 class="uk-h3">Still stuck?</h2>
          <p>Send us a message and we will get back to you within two working days.</p>
          <a class="uk-button uk-button-primary" href="/contact">Contact us</a>
        </div>
        <p class="uk-text-meta uk-margin-large-top">This is example content. Edit it or delete it from Content.</p>
      format: full_html
      summary: 'Read the docs, ask a question or report a problem.'
