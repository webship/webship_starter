################
# GitLab CI for the Webship Starter site template (a drupal-recipe project).
#
# The drupal.org GitLab templates build a Drupal site with this recipe in
# recipes/webship_starter, then run composer-lint and cspell. The `recipe` job
# below installs Drupal from the recipe to prove that it applies.
# Documentation: https://project.pages.drupalcode.org/gitlab_templates/
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # Also check that Composer resolves on the next major Drupal version.
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1
  _TARGET_PHP: '8.4'
  DRUPAL_CORE: &drupal_core '11.4.x-dev'
  # No PHP, CSS or PHPUnit tests here. The only JavaScript is the webship-js
  # test tooling, and the recipe YAML is checked by applying the recipe.
  SKIP_ESLINT: '1'
  SKIP_PHPCS: '1'
  SKIP_PHPSTAN: '1'
  SKIP_PHPUNIT: '1'
  SKIP_STYLELINT: '1'
  # Node modules are only needed by cspell, which installs them itself.
  _COMPOSER_YARN_INSTALL: '0'
  # composer-lint and cspell must pass.
  _ALL_VALIDATE_ALLOW_FAILURE: '0'
  # A third-party library script.
  _CSPELL_IGNORE_PATHS: 'scripts/libs/**'

composer:
  variables:
    # The composer job sets its own DRUPAL_CORE: use the global value.
    DRUPAL_CORE: *drupal_core

# Install Drupal from the recipe, and check the result.
recipe:
  extends: .testing-job-base
  needs: [composer]
  # Only the database: no browser is needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    EXPECTED_THEME: 'ui_suite_uikit'
  script:
    - cd $CI_PROJECT_DIR
    - test "$COMPOSER_END_CODE" = "0"
    # Run the Drush PHP script directly: vendor/bin/drush is a shell proxy.
    - export DRUSH="php -d memory_limit=-1 $CI_PROJECT_DIR/vendor/drush/drush/drush.php --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    - $DRUSH site:install $CI_PROJECT_DIR/recipes/$PROJECT_NAME -y
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name=admin --account-pass=admin --site-name="$PROJECT_NAME"
    - $DRUSH status --fields=drupal-version,db-status,theme
    - test "$($DRUSH config:get system.theme default --format=string)" = "$EXPECTED_THEME"
    # Web Admin makes UIkit Admin the administration theme.
    - test "$($DRUSH config:get system.theme admin --format=string)" = "uikit_admin"
    # The Webship features are installed: documentation, products and
    # releases, the newsletter form, social sharing and the dashboards.
    - test "$($DRUSH config:get node.type.webdoc type --format=string)" = "webdoc"
    - test "$($DRUSH config:get node.type.product type --format=string)" = "product"
    - test "$($DRUSH config:get node.type.release type --format=string)" = "release"
    - test "$($DRUSH config:get webform.webform.newsletter_subscribe id --format=string)" = "newsletter_subscribe"
    - $DRUSH pm:list --status=enabled --format=list | grep -qx webshare
    - $DRUSH pm:list --status=enabled --format=list | grep -qx webdashboard
    # The default content is imported: the Home, Make it yours and Support
    # pages, the Documentation page and its three guides, the Marigold example
    # product with two releases, and the images.
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "webpage")->count()->execute();')" -eq 3
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "webdoc")->count()->execute();')" -eq 4
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "product")->count()->execute();')" -eq 1
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("node")->accessCheck(FALSE)->condition("type", "release")->count()->execute();')" -eq 2
    - test "$($DRUSH php:eval 'print \Drupal::entityQuery("media")->accessCheck(FALSE)->condition("bundle", "image")->count()->execute();')" -eq 4
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/make-it-yours");')" != "/make-it-yours"
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/support");')" != "/support"
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/docs/your-first-board");')" != "/docs/your-first-board"
    - test "$($DRUSH php:eval 'print \Drupal::service("path_alias.manager")->getPathByAlias("/products/marigold/releases/1.1.0");')" != "/products/marigold/releases/1.1.0"
    # The look: the Clear ink colors of UI Skins, with a dark mode value.
    - test "$($DRUSH config:get ui_suite_uikit.settings third_party_settings.ui_skins.css_variables.ui-suite-uikit-global-primary-background --format=json | grep -c 2448c4)" -eq 1

# Drupal 12: let Composer install the contributed modules that do not declare
# ^12 yet.
composer (next major):
  variables:
    _LENIENT_ALLOW_LIST: 'ai,ai_agents,ai_assistant_api,ai_chatbot,ai_content_suggestions,ai_image_alt_text,ai_logging,ai_penpot,ai_playwright,ai_provider_anthropic,ai_provider_huggingface,ai_provider_ollama,ai_provider_openai,ai_provider_xai,ai_translate,antibot,autocomplete_deluxe,automatic_updates,better_exposed_filters,captcha,coffee,config_filter,config_ignore,config_import_single,config_rewrite,config_split,config_update,config_update_ui,consumers,crop,ctools,dashboards,display_builder,display_builder_entity_view,display_builder_page_layout,display_builder_ui,display_builder_views,drupical,easy_breadcrumb,easy_encryption,editor_advanced_link,embed,entity_embed,field_group,field_validation,flood_control,focal_point,friendlycaptcha,gemini_provider,google_analytics,google_tag,honeypot,inline_entity_form,jsonapi_extras,key,klaro,login_emailusername,manage_display,media_directories_editor,media_directories_ui,media_remote_audio,media_remote_image,metatag,openapi,openapi_jsonapi,openapi_rest,openapi_ui,openapi_ui_swagger,pathauto,recaptcha_v3,redirect,restui,sam,schema_metatag,schemata,schemata_json_schema,seckit,security_review,shield,simple_oauth,smart_trim,tagify,token,token_filter,tracker,user_redirect,view_password,views_bulk_edit,views_bulk_operations,webform,xmlsitemap,yoast_seo'
